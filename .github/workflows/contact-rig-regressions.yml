name: Contact and rig regressions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - '.github/workflows/contact-rig-regressions.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-rig-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [contact-rig, lineage, game-packages]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify correction editor requests and staging
        run: node tests/test_native_scene_fit_editor.mjs
      - name: Verify portable correction and speed lineage
        if: matrix.suite == 'lineage'
        run: >-
          python -m pytest -q --durations=10
          tests/test_native_rotation_speed_lineage.py
          tests/test_native_correction_lineage.py
      - name: Verify scene game packages
        if: matrix.suite == 'game-packages'
        run: >-
          python -m pytest -q --durations=10
          tests/test_studio_native_scene_game.py
      - name: Verify pose, boundary audit and complete surface populations
        if: matrix.suite == 'contact-rig'
        run: >-
          python -m pytest -q --durations=10
          tests/test_native_rotation_speed_integration.py
          tests/test_native_skin_encoding.py
          tests/test_native_scene_engine.py
          tests/test_native_scene_norms.py
          tests/test_native_scene_fit.py
          tests/test_native_surface_model.py
          tests/test_native_surface_recentered.py
          tests/test_native_geometry_norms.py
          tests/test_native_scene_recentered_restore.py
          tests/test_native_rotation_storage_search.py
          tests/test_native_rotation_storage_repair.py
          tests/test_native_rate_receipts.py
          tests/test_native_storage_continuation.py
          tests/test_native_fit_storage.py
          tests/test_studio_native_storage.py
          tests/test_timed_rotation_edit.py
          tests/test_studio_native_scene_fit.py
          tests/test_native_rotation_speed_fit.py
          tests/test_native_rotation_speed_preflight.py
          tests/test_temporal_rotation_bounds.py
          tests/test_rig_pose_scaffold.py
          tests/test_pose_length_preflight.py
          tests/test_bounded_pose_ik.py
          tests/test_bounded_pose_ball_ik.py
          tests/test_native_scene_boundary_edit.py
          tests/test_native_scene_boundaries.py
          tests/test_native_compact_surface_rows.py
          tests/test_native_plane_envelope.py
          tests/test_native_stored_pair_job.py
          tests/test_static_prop_asset.py
          tests/test_studio_props.py
          tests/test_studio_prop_routes.py
