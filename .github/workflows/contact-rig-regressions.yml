name: Contact and rig regressions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - '.github/contact-rig-source-tests.json'
      - '.github/workflows/contact-rig-regressions.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-rig-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [contact-rig, lineage, game-packages]
        shard: [0]
        include:
          - os: ubuntu-latest
            suite: contact-rig
            shard: 1
          - os: windows-latest
            suite: contact-rig
            shard: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked native reviewer runtime
        if: matrix.suite == 'contact-rig'
        run: npm ci --ignore-scripts --prefix assets/viewer
      - name: Verify correction editor requests and staging
        run: node tests/test_native_scene_fit_editor.mjs
      - name: Verify portable correction and speed lineage
        if: matrix.suite == 'lineage'
        run: >-
          python -m pytest -q --durations=10
          tests/test_native_rotation_speed_lineage.py
          tests/test_native_correction_lineage.py
      - name: Verify scene game packages
        if: matrix.suite == 'game-packages'
        run: >-
          python -m pytest -q --durations=10
          tests/test_studio_native_scene_game.py
      - name: Verify pose, boundary audit and complete surface populations
        if: matrix.suite == 'contact-rig'
        run: >-
          python scripts/run_source_checks.py
          --manifest .github/contact-rig-source-tests.json
          --shard-index ${{ matrix.shard }} --shard-count 2
