permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      STREP_TEST_FILE: ${{ inputs.test_file }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned CPU dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Run selected source suite with observations
        if: ${{ inputs.test_file != 'tests/test_kimodo_scene_guidance.py' && inputs.test_file != 'tests/test_kimodo_scene_retention.py' && inputs.test_file != 'tests/test_mesh_penetration_gradient.py' }}
        shell: bash
        run: python -m pytest -q -s --showlocals "$STREP_TEST_FILE"
      - name: Install CPU tensors for experimental scene guidance
        if: ${{ inputs.test_file == 'tests/test_kimodo_scene_guidance.py' || inputs.test_file == 'tests/test_kimodo_scene_retention.py' || inputs.test_file == 'tests/test_mesh_penetration_gradient.py' }}
        run: >-
          python -m pip install --only-binary=:all: torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify scene guidance and sparse skin derivatives
        if: ${{ inputs.test_file == 'tests/test_kimodo_scene_guidance.py' }}
        run: python -m pytest -q -s --showlocals tests/test_kimodo_scene_guidance.py tests/test_linear_skin_operator.py
      - name: Verify authored scene wiring and strict metric retention
        if: ${{ inputs.test_file == 'tests/test_kimodo_scene_retention.py' || inputs.test_file == 'tests/test_mesh_penetration_gradient.py' }}
        run: >-
          python -m pytest -q -s --showlocals tests/test_kimodo_scene_retention.py tests/test_scene_metric_retention.py tests/test_compile_scene_guidance.py tests/test_authored_skin_scene_energy.py tests/test_kimodo_scene_guidance.py tests/test_linear_skin_operator.py tests/test_authored_scene_observations.py tests/test_scene_motion_envelope.py tests/test_mesh_penetration_gradient.py tests/test_articulated_track.py tests/test_conic_pose_minimax.py tests/test_sequential_scene_step.py tests/test_conic_pose_affine.py tests/test_sampled_articulated_track.py
