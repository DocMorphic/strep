name: Focused source diagnostics

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: Model-free source suite
        required: true
        type: choice
        default: tests/test_native_motion_orientation.py
        options:
          - tests/test_native_self_separation_cuts.py
          - tests/test_native_self_surface.py
          - tests/test_native_containment_crosscheck.py
          - tests/test_native_meeting_orientation.py
          - tests/test_native_partitioned_affine_pose.py
          - tests/test_native_surface_frame_pair.py
          - tests/test_native_surface_frame.py
          - tests/test_native_anchor_placement.py
          - tests/test_kimodo_versioned_checkpoint.py
          - tests/test_native_motion_orientation.py
          - tests/test_native_vertical_root.py
          - tests/test_native_affine_interval_seed.py
          - tests/test_native_seed_restoration.py
          - tests/test_native_key_cached_recourse.py
          - tests/test_native_key_contact_retention.py
          - tests/test_native_floor_tiles.py
          - tests/test_native_geometry_journal.py
          - tests/test_native_scene_engine_complete.py
          - tests/test_surface_separation_planes.py
          - tests/test_native_pose_plane_vertices.py
          - tests/test_native_pose_reference.py
          - tests/test_native_key_interval_model.py
          - tests/test_native_pair_key_guides.py
          - tests/test_native_pair_contact_objectives.py
          - tests/test_native_contact_actor_validation.py
          - tests/test_native_actor_derivatives.py
          - tests/test_native_surface_key_jacobian.py
          - tests/test_native_pair_separation_cuts.py
          - tests/test_native_interval_pair_fit_job.py
          - tests/test_native_interval_pair_restore_job.py
          - tests/test_native_interval_pair_retry_job.py
          - tests/test_native_scene_conic_sum.py
          - tests/test_native_affine_sum_segment.py
          - tests/test_native_depth_guarded_recourse.py
          - tests/test_native_partner_material_vectors.py
          - tests/test_native_material_bound_restore.py
          - tests/test_native_shared_placement.py
          - tests/test_native_scene_runtime_modes.py
          - tests/test_native_runtime_surface_capture.py
          - tests/test_native_runtime_mode_stream.py
          - tests/test_native_runtime_geometry_journal.py
          - tests/test_native_configured_scene_runtime.py
          - tests/test_native_pivot_placement.py
          - tests/test_native_pair_surface_guidance.py
          - tests/test_native_material_depth_bounds.py
          - tests/test_native_pair_material_recourse.py
          - tests/test_highs_thread_policy.py
          - tests/test_native_scene_conic_secondary.py
          - tests/test_desktop_build_preservation.py

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      STREP_TEST_FILE: ${{ inputs.test_file }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned CPU dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Run selected source suite with observations
        shell: bash
        run: python -m pytest -q -s --showlocals "$STREP_TEST_FILE"
