name: Model-free source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Verify geometry, contact certificates and Studio build
        run: >-
          python -m pytest -q
          tests/test_object_geometry_mesh.py
          tests/test_boundary_motion.py
          tests/test_paired_stage_rates.py
          tests/test_paired_temporal_neighbor.py
          tests/test_paired_guarded_temporal.py
          tests/test_paired_surface_witness.py
          tests/test_paired_approach_basis.py
          tests/test_coupled_pair_constraints.py
          tests/test_directional_pair_proposal.py
          tests/test_pair_direction_peak.py
          tests/test_elbow_swivel.py
          tests/test_two_bone_waypoint.py
          tests/test_wrist_waypoint_motion.py
          tests/test_waypoint_lattice.py
          tests/test_waypoint_path_evidence.py
          tests/test_hand_surface_screen.py
          tests/test_terminal_hand_search.py
          tests/test_terminal_rate_diagnosis.py
          tests/test_continuous_terminal_hand.py
          tests/test_oriented_terminal_hand.py
          tests/test_hand_witness_reuse.py
          tests/test_hand_control_reuse.py
          tests/test_hand_geometry_comparison.py
          tests/test_witness_epigraph.py
          tests/test_finite_difference_audit.py
          tests/test_smooth_hand_proposal.py
          tests/test_hand_norm_proposal.py
          tests/test_iterated_hand_norm.py
          tests/test_sampled_surface_guard.py
          tests/test_hand_witness_envelope.py
          tests/test_skin_motion_bounds.py
          tests/test_swept_surface_boxes.py
          tests/test_adaptive_surface_intervals.py
          tests/test_swept_triangle_separation.py
          tests/test_skin_taylor_bounds.py
          tests/test_triangle_separation_objective.py
          tests/test_native_finger_motion.py
          tests/test_replay_finger_proposal.py
          tests/test_independent_hand_motion.py
          tests/test_native_waypoint_clock.py
          tests/test_motion_lattice.py
          tests/test_decoded_motion_edges.py
          tests/test_continuous_waypoint_motion.py
          tests/test_waypoint_projection.py
          tests/test_coupled_pair_reserve.py
          tests/test_coupled_surface_norms.py
          tests/test_coupled_continuation_policy.py
          tests/test_coupled_continuation_checkpoint.py
          tests/test_coupled_clearance_policy.py
          tests/test_paired_review_summary.py
          tests/test_timed_rotation_edit.py
          tests/test_scene_pair_problem.py
          tests/test_scene_pair_replay.py
          tests/test_publish_scene_pair_fit.py
          tests/test_scene_pair_activity.py
          tests/test_scene_pair_engine.py
          tests/test_scene_pair_limits.py
          tests/test_scene_pair_refinement.py
          tests/test_refined_pair_geometry.py
          tests/test_joint_angular_rates.py
          tests/test_angular_motion_rows.py
          tests/test_scene_pair_angular_constraints.py
          tests/test_scene_pair_relinearization.py
          tests/test_continuation_evidence.py
          tests/test_continuation_geometry.py
          tests/test_atomic_json_save.py
          tests/test_prepare_vendor.py
          tests/test_pair_geometry_recovery.py
          tests/test_scene_geometry_reuse.py
          tests/test_scene_export_rates.py
          tests/test_scalar_angular_replay.py
          tests/test_scene_angular_publication.py
          tests/test_scene_review_update.py
          tests/test_reserve_publication_geometry.py
          tests/test_assemble_scene_pair_reserve.py
          tests/test_assemble_scene_pair_continuation.py
          tests/test_copy_prepared_pair_review.py
          tests/test_refined_solver_scaling.py
          tests/test_refined_trust_limits.py
