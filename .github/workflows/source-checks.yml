name: Model-free source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adapter-source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-ci.txt safetensors==0.8.0
          python -m pip install --only-binary=:all: torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify direct native pose inequalities
        run: python -m pytest -q tests/test_scene_pose_restoration.py tests/test_guarded_pose_restoration.py tests/test_sparse_pose_jacobian.py tests/test_pose_row_jacobian.py tests/test_grasp_pose_witness.py tests/test_contact_finger_budgets.py tests/test_coupled_pose_window.py tests/test_guarded_window_restoration.py
      - name: Verify adapter lifecycle and reviewed native correction pipeline
        run: python -m pytest -q tests/test_kimodo_adapter_probe.py tests/test_kimodo_denoising_target.py tests/test_kimodo_adapter_state.py tests/test_kimodo_training_corpus.py tests/test_pack_native_correction.py tests/test_kimodo_corpus_reader.py tests/test_studio_correction_review.py tests/test_kimodo_corpus_trainer.py tests/test_native_candidate_preview.py tests/test_native_motion_edit.py tests/test_native_review_support.py
  material-scene-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Verify portable material authoring and native job integration
        run: python -m pytest -q tests/test_material_scene_package.py tests/test_material_scene_surface_job.py tests/test_studio_material_patch.py tests/test_studio_material_region.py tests/test_studio_material_region_pose.py tests/test_rigid_contact_normal_bound.py tests/test_native_contact_mask_probe.py tests/test_saved_contact_stencil_step.py
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Verify geometry, contact certificates and Studio build
        run: >-
          python scripts/run_source_checks.py --shard-index ${{ matrix.shard }} --shard-count 4
      - name: Verify contact editor workflows without a browser
        if: matrix.shard == 0
        run: python scripts/run_source_checks.py --mode node
