name: Model-free source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Verify geometry, contact certificates and Studio build
        run: >-
          python -m pytest -q
          tests/test_object_geometry_mesh.py
          tests/test_boundary_motion.py
          tests/test_paired_stage_rates.py
          tests/test_paired_temporal_neighbor.py
          tests/test_paired_guarded_temporal.py
          tests/test_paired_surface_witness.py
          tests/test_paired_approach_basis.py
          tests/test_coupled_pair_constraints.py
          tests/test_coupled_pair_reserve.py
          tests/test_coupled_surface_norms.py
          tests/test_coupled_continuation_policy.py
          tests/test_coupled_continuation_checkpoint.py
          tests/test_coupled_clearance_policy.py
          tests/test_paired_review_summary.py
          tests/test_timed_rotation_edit.py
          tests/test_scene_pair_problem.py
          tests/test_scene_pair_replay.py
          tests/test_publish_scene_pair_fit.py
          tests/test_scene_pair_activity.py
          tests/test_scene_pair_engine.py
          tests/test_scene_pair_limits.py
          tests/test_scene_pair_refinement.py
          tests/test_refined_pair_geometry.py
          tests/test_joint_angular_rates.py
          tests/test_angular_motion_rows.py
          tests/test_scene_pair_angular_constraints.py
          tests/test_scene_geometry_reuse.py
          tests/test_scene_export_rates.py
          tests/test_scalar_angular_replay.py
          tests/test_scene_angular_publication.py
          tests/test_scene_review_update.py
          tests/test_bound_evidence.py
          tests/test_paired_window_feasibility.py
          tests/test_proximity_candidate_filter.py
          tests/test_scene_joint_rates.py
          tests/test_lsmr_accuracy.py
          tests/test_inward_feasibility_step.py
          tests/test_pose_feasibility_phase.py
          tests/test_point_rate_reachability.py
          tests/test_contact_rate_feasibility.py
          tests/test_contact_engine_events.py
          tests/test_contact_pose_reachability.py
          tests/test_contact_pose_sphere_bound.py
          tests/test_desktop_build.py
          tests/test_desktop_build_preservation.py
      - name: Verify contact editor workflows without a browser
        run: |
          node tests/test_contact_timing_editor.mjs
          node tests/test_contact_export_review.mjs
          node tests/test_scene_object_geometry.mjs
          node tests/test_scene_fractional_preview.mjs
          node tests/test_scene_pair_editor.mjs
          node tests/test_scene_trim_editor.mjs
          node tests/test_scene_region_editor.mjs
          node tests/test_scene_feedback.mjs
