<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>strep · motion inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101821;color:#e6edf3;font:16px system-ui}main{max-width:1200px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:26px}#origin{color:#ffc876;font-size:14px}canvas{display:block;width:100%;height:60vh;min-height:300px;border:1px solid #344354;border-radius:12px;background:#15212d;margin:20px 0}section{display:flex;align-items:center;gap:16px;flex-wrap:wrap}input[type=range]{flex:1;min-width:160px}button,select{background:#283f52;border:1px solid #55708a;color:white;border-radius:6px;padding:10px;cursor:pointer}pre{white-space:pre-wrap;color:#abc4d9;font-size:13px}p{color:#afc0ce}a{color:#79d9c8}
</style>
<main><header><h1>strep / motion inspection</h1><span id="origin"></span></header>
<p id="info"></p><canvas id="canvas" aria-label="Animated skeleton with fixed world-space camera"></canvas>
<section><button id="play">Pause</button><label for="view">View</label><select id="view"><option value="front">Front · XY</option><option value="side">Side · ZY</option><option value="top">Top · XZ</option></select><input id="frame" aria-label="Frame" type="range" min="0" value="0"><output id="time"></output></section>
<p>Source skeleton and pelvis track. The camera stays fixed to preserve root travel. Contact intervals are model predictions; this view does not certify scene interaction or rig transfer.</p><pre id="metrics"></pre></main>
<script>
const data=__MOTION_DATA__;
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#frame'),play=document.querySelector('#play'),view=document.querySelector('#view');
document.querySelector('#origin').textContent=data.report.provenance==='upstream_example_not_generated_here'?'UPSTREAM EXAMPLE · NOT GENERATED HERE':data.report.provenance;
document.querySelector('#info').textContent=`${data.report.frames} frames · ${data.report.fps} fps · ${data.report.joints} joints · ${data.report.contact_labels.length} contact channels`;
document.querySelector('#metrics').textContent=JSON.stringify(data.report.metrics,null,2);slider.max=data.positions.length-1;
let running=true,frame=0,last=performance.now(),accumulator=0;
const bounds=[0,1,2].map(axis=>{let lo=Infinity,hi=-Infinity;for(const pose of data.positions)for(const p of pose){lo=Math.min(lo,p[axis]);hi=Math.max(hi,p[axis]);}return[lo,hi];});
function draw(){const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const axes=view.value==='front'?[0,1]:view.value==='side'?[2,1]:[0,2],bx=bounds[axes[0]],by=bounds[axes[1]],scale=Math.min((w-80)/Math.max(bx[1]-bx[0],1),(h-80)/Math.max(by[1]-by[0],1)),cx=(bx[0]+bx[1])/2,cy=(by[0]+by[1])/2;const project=p=>[w/2+(p[axes[0]]-cx)*scale,h/2-(p[axes[1]]-cy)*scale];ctx.strokeStyle='#334759';ctx.lineWidth=1;for(let n=Math.floor(bx[0])-1;n<=Math.ceil(bx[1])+1;n++){const x=w/2+(n-cx)*scale;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}const ground=h/2+cy*scale;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(w,ground);ctx.stroke();ctx.strokeStyle='#cd9d63';ctx.beginPath();data.positions.forEach((p,i)=>{const v=project(p[0]);i?ctx.lineTo(...v):ctx.moveTo(...v);});ctx.stroke();const pose=data.positions[frame];ctx.strokeStyle='#77dfcb';ctx.lineWidth=2;pose.forEach((p,i)=>{const parent=data.parents[i];if(parent>=0){ctx.beginPath();ctx.moveTo(...project(pose[parent]));ctx.lineTo(...project(p));ctx.stroke();}});ctx.fillStyle='#f0faf8';pose.forEach(p=>{ctx.beginPath();ctx.arc(...project(p),2.1,0,Math.PI*2);ctx.fill();});slider.value=frame;document.querySelector('#time').textContent=`${frame} / ${(frame/data.report.fps).toFixed(2)}s`;}
play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play';};slider.oninput=()=>{frame=Number(slider.value);running=false;play.textContent='Play';draw();};view.onchange=draw;window.onresize=draw;
function tick(t){if(running){accumulator+=Math.min(t-last,250);const step=1000/data.report.fps;if(accumulator>=step){const advance=Math.floor(accumulator/step);frame=(frame+advance)%data.positions.length;accumulator-=advance*step;draw();}}last=t;requestAnimationFrame(tick);}draw();requestAnimationFrame(tick);
</script></html>
