<section id="controlCenter" class="system-popover control-center" role="dialog" aria-label="Control Center" hidden>
  <div id="ccMain" class="cc-mosaic">
    <button class="cc-module cc-wifi" data-system-control="wifi" aria-label="Wi-Fi — system control"><span class="cc-disc"><svg viewBox="0 0 24 24"><path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg></span><span><strong>Wi-Fi</strong><small>System control</small></span></button>
    <div class="cc-module cc-media"><div class="cc-art" data-icon="preview"></div><strong id="ccClip">No animation</strong><span class="cc-media-sub">strep · Motion preview</span><div class="cc-media-buttons"><button id="ccRestart" aria-label="Restart animation" title="Restart"><svg viewBox="0 0 24 24"><path d="M5 5v14M19 5 8 12l11 7z" fill="currentColor"/></svg></button><button id="ccPlay" aria-label="Play animation" disabled><svg viewBox="0 0 24 24"><path d="m7 3 15 9-15 9z" fill="currentColor"/></svg></button><button id="ccNext" aria-label="Next animation" title="Next animation"><svg viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7z" fill="currentColor"/></svg></button></div></div>
    <button class="cc-module cc-round cc-bluetooth cc-white" data-system-control="bluetooth" aria-label="Bluetooth — system control" title="Bluetooth"><svg viewBox="0 0 24 24"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg></button>
    <button class="cc-module cc-round cc-airdrop cc-white" data-system-control="airdrop" aria-label="AirDrop — system control" title="AirDrop"><svg viewBox="0 0 24 24"><path d="M5 18a10 10 0 1 1 14 0M8 15a6 6 0 1 1 8 0M10 12a3 3 0 1 1 4 0M12 14l-4 7h8z"/></svg></button>
    <button id="ccFocus" class="cc-module cc-focus" aria-pressed="false"><span class="cc-disc"><svg viewBox="0 0 24 24"><path d="M19 16A8 8 0 0 1 8 5a8 8 0 1 0 11 11z" fill="currentColor" stroke="none"/></svg></span><strong>Focus</strong></button>
    <button id="ccStage" class="cc-module cc-round cc-stage" aria-label="Stage Manager" aria-pressed="false" title="Stage Manager"><svg viewBox="0 0 24 24"><rect x="9" y="4" width="13" height="16" rx="2"/><path d="M3 5h1M3 11h1M3 17h1" stroke-width="3"/></svg></button>
    <button class="cc-module cc-round cc-mirror" data-system-control="mirror" aria-label="Screen Mirroring — system control" title="Screen Mirroring"><svg viewBox="0 0 24 24"><rect x="7" y="8" width="15" height="12" rx="2"/><path d="M4 16H3a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2"/></svg></button>
    <div class="cc-module cc-slider cc-display"><label for="ccBrightness">Display</label><div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg><input id="ccBrightness" type="range" min="45" max="100" value="100" aria-label="Workspace display brightness" title="Adjusts this workspace, not the monitor"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg></div></div>
    <div class="cc-module cc-slider cc-sound"><label for="ccVolume">Sound</label><div><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/></svg><input id="ccVolume" type="range" min="0" max="100" value="0" disabled aria-label="Sound — these animation clips contain no audio" title="These animation clips contain no audio"><svg viewBox="0 0 24 24"><path d="M2 9h4l5-4v14l-5-4H2z" fill="currentColor" stroke="none"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><button data-system-control="sound" aria-label="Sound options"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="8"/><circle cx="12" cy="10" r="5"/><path d="m12 11-5 10h10z" fill="currentColor" stroke="none"/></svg></button></div></div>
    <button id="ccDark" class="cc-module cc-round cc-appearance" aria-label="Dark Mode" aria-pressed="false" title="Dark Mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
    <button class="cc-module cc-round cc-calculator" data-cc-utility="calculator" aria-label="Calculator" title="Calculator"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h1m3 0h1m3 0h.1M8 15h1m3 0h1m3 0h.1M8 19h1m3 0h1m3 0h.1" stroke-width="2"/></svg></button>
    <button class="cc-module cc-round cc-timer" data-cc-utility="timer" aria-label="Stopwatch" title="Stopwatch"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-7 3M12 3v4M3 3l4 4m5 3 3 3"/></svg></button>
    <button id="ccCapture" class="cc-module cc-round cc-capture" aria-label="Save preview screenshot" title="Save preview screenshot"><svg viewBox="0 0 24 24"><path d="M5 3H2v3m17-3h3v3M2 18v3h3m17-3v3h-3"/><rect x="5" y="7" width="14" height="11" rx="2"/><path d="M9 7V5h6v2"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button id="ccEdit" class="cc-edit">Edit Controls</button>
  </div>
  <div id="ccDetail" class="cc-module cc-detail" hidden><button id="ccBack" class="cc-back" aria-label="Back to Control Center">‹</button><h2 id="ccDetailTitle"></h2><div id="ccDetailBody"></div></div>
  <span id="ccStatus" hidden></span><button id="ccDock" hidden></button><button id="ccMotion" hidden></button>
</section>
