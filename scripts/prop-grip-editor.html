<details id="propGripPanel">
<summary>Object grip points</summary>
<p>Import a static GLB object, then click its surface to mark a hand grip. Saved points describe your intent; they do not create or verify a grasp animation.</p>
<label>Object file <input id="propGripFile" type="file" accept=".glb"></label>
<label>Source or license note <input id="propGripLicense" type="text" maxlength="2000" placeholder="Where this object came from"></label>
<button type="button" class="btn" id="propGripImport">Import object</button>
<label>Reopen saved object <input id="propGripAsset" type="text" maxlength="64" placeholder="Paste its saved object ID"></label>
<button type="button" class="btn" id="propGripOpen">Open object</button>
<p id="propGripInfo"></p>
<div style="height:300px;position:relative;background:#222936;border-radius:12px;overflow:hidden"><canvas id="propGripCanvas" style="width:100%;height:100%;display:block" aria-label="Object grip preview: drag to orbit, scroll to zoom, enable Pick grip then click the surface"></canvas></div>
<div class="transport"><button type="button" class="btn" id="propGripPick" disabled>Pick grip</button><button type="button" class="btn" id="propGripHome" disabled>Frame object</button></div>
<label>Grip name <input id="propGripLabel" type="text" maxlength="120" value="Left hand"></label>
<button type="button" class="btn primary" id="propGripSave" disabled>Save grip point</button>
<label>Saved grip <select id="propGripSaved" disabled></select></label>
<button type="button" class="btn" id="propGripShow" disabled>Show saved grip</button>
<p id="propGripStatus" role="status" aria-live="polite">Choose a self-contained static GLB up to 32 MiB.</p>
<div id="propGripDownloads"></div>
</details>
